name: Publish due reels

# Runs on a schedule in GitHub's cloud (your computer can be off).
# Every run: check the queue, publish anything due, commit the updated
# statuses back so the next run doesn't re-publish them.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC). GitHub may delay a few min.
  workflow_dispatch:          # manual run. Optionally allow a DELIBERATE burst.
    inputs:
      max_per_run:
        description: "Max reels to publish this run (default 1). Set higher only for an intentional burst."
        required: false
        default: "1"
      min_gap_min:
        description: "Min minutes since last post before publishing (default 25). Set 0 for a burst."
        required: false
        default: "25"

# Allow the workflow to commit queue.json changes back to the repo.
permissions:
  contents: write

concurrency:
  group: publish-reels
  cancel-in-progress: false   # never run two publishers at once

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub runners are UTC; queue.json times are written in local time.
    # Force the runner's clock to the user's timezone so datetime.now() matches.
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish anything due
        env:
          # Secrets are set in repo Settings -> Secrets and variables -> Actions.
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          # Scheduled runs send no inputs -> these are empty -> run_due uses its
          # safe defaults (1 / 25). Only a manual burst dispatch sets them higher.
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run }}
          MIN_GAP_MIN: ${{ github.event.inputs.min_gap_min }}
        run: python run_due.py

      - name: Commit updated queue state
        run: |
          git config user.name  "reel-scheduler-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/queue.json; then
            git add data/queue.json
            git commit -m "chore: update queue status [skip ci]"
            git push
          else
            echo "No queue changes to commit."
          fi
