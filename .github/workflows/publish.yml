name: Publish due reels

# Runs on a schedule in GitHub's cloud (your computer can be off).
# Every run: check the queue, publish anything due, commit the updated
# statuses back so the next run doesn't re-publish them.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC). GitHub may delay a few min.
  workflow_dispatch:          # manual run. Optionally allow a DELIBERATE burst.
    inputs:
      max_per_run:
        description: "Max reels to publish this run (default 1). Set higher only for an intentional burst."
        required: false
        default: "1"
      min_gap_min:
        description: "Min minutes since last post before publishing (default 25). Set 0 for a burst."
        required: false
        default: "25"
      stale_grace_min:
        description: "Skip jobs later than this many min past their slot (default 180). Raise to re-fire a delayed burst."
        required: false
        default: "180"

# Allow the workflow to commit queue.json changes back to the repo.
permissions:
  contents: write

concurrency:
  group: publish-reels
  cancel-in-progress: false   # never run two publishers at once

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub runners are UTC; queue.json times are written in local time.
    # Force the runner's clock to the user's timezone so datetime.now() matches.
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish anything due
        env:
          # Secrets are set in repo Settings -> Secrets and variables -> Actions.
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          # WINNING FORMAT (measured from the 123K batch, DO NOT CHANGE the spacing):
          # jobs are scheduled ~1 min apart in a morning burst from 09:24 Madrid,
          # exactly like the batch that hit 123K/46K (Meta timestamps: 19 reels
          # ~46s apart, 07:24-07:38 UTC). The ~1-min queue spacing spreads the API
          # calls across cron runs so we never re-trigger the 403 "Application
          # request limit reached" that killed a same-second 23-at-once dump.
          # MAX_PER_RUN=10 lets a run publish a tight batch (winner did 19/run)
          # without an instantaneous storm.
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '10' }}
          MIN_GAP_MIN: ${{ github.event.inputs.min_gap_min || '0' }}
          # STALE_GRACE=180min: GitHub's scheduled cron is routinely delayed
          # 30-60+ min. With the old 45-min default a delayed run marked a whole
          # tight burst as "missed" (happened Aug 11 — 21 of 23 skipped after a
          # ~60min cron delay). 180min lets a delayed run still fire the day's
          # burst, while a truly old past-dated backlog is still blocked because
          # each day's jobs are same-day and MAX_PER_RUN caps any pileup.
          STALE_GRACE_MIN: ${{ github.event.inputs.stale_grace_min || '180' }}
        run: python run_due.py

      - name: Commit updated queue state
        run: |
          git config user.name  "reel-scheduler-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/queue.json; then
            git add data/queue.json
            git commit -m "chore: update queue status [skip ci]"
            git push
          else
            echo "No queue changes to commit."
          fi
